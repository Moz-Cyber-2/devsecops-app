name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Secrets Scanning — TruffleHog (reusable from gh-actions-security)
  # ─────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    uses: Moz-Cyber-2/gh-actions-security/.github/workflows/secrets-scan-pr.yaml@main
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────
  # 2. SAST — Semgrep (reusable from gh-actions-security)
  # ─────────────────────────────────────────────────────────────────────
  sast:
    name: SAST
    uses: Moz-Cyber-2/gh-actions-security/.github/workflows/reusable-sast.yml@main
    secrets: inherit
    with:
      config: "p/owasp-top-ten p/nodejs p/secrets"
      fail_on_findings: true

  # ─────────────────────────────────────────────────────────────────────
  # 3. Build Docker image — stays on self-hosted runner
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: devsecops-demo
    permissions:
      contents: read
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          IMAGE="devsecops-app"
          TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          echo "image_ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          podman build \
            --tag "${{ steps.meta.outputs.image_ref }}" \
            .

  # ─────────────────────────────────────────────────────────────────────
  # 4. Container Scan — Trivy (reusable from gh-actions-security)
  #    Runs on the same self-hosted runner; reads image directly from
  #    the local Podman store — no tarball upload/download needed.
  # ─────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan
    needs: build
    uses: Moz-Cyber-2/gh-actions-security/.github/workflows/reusable-container-scan.yml@main
    secrets: inherit
    with:
      image_ref: ${{ needs.build.outputs.image_ref }}
      severity: "HIGH,CRITICAL"
      fail_on_findings: true
