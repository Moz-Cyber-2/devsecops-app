name: PR Pipeline — Security Gates

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# All jobs must pass before merge is allowed.
# Branch protection rules should require this workflow to pass.

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Secrets Scanning — TruffleHog
  #    Reuses the production-grade workflow from security-gh-actions.
  #    If a secret is found: PR is blocked + comment posted + label added.
  #    Developer can run /clean-secrets to rewrite git history.
  # ─────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan (TruffleHog)
    uses: DEMO_ORG/security-gh-actions/.github/workflows/secrets-scan-pr.yaml@main
    permissions:
      contents: read
      pull-requests: write

  # ─────────────────────────────────────────────────────────────────────
  # 2. SAST — Semgrep
  #    Scans for OWASP API Top 10, injection flaws, hardcoded secrets.
  #    Findings uploaded to GitHub Security tab (SARIF).
  # ─────────────────────────────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    uses: DEMO_ORG/security-gh-actions/.github/workflows/reusable-sast.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      config: "p/owasp-top-ten p/nodejs p/secrets"
      fail_on_findings: true

  # ─────────────────────────────────────────────────────────────────────
  # 3. Build Docker Image
  #    Builds the image without pushing (PR = no registry push).
  #    Exports the image as a tarball for the container scan step.
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tarball: ${{ steps.meta.outputs.image_tarball }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          IMAGE="devsecops-app"
          TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tarball=${IMAGE}.tar" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            .

      - name: Export image tarball for scan
        run: |
          docker save "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            -o "${{ steps.meta.outputs.image_tarball }}"

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ steps.meta.outputs.image_tarball }}
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # 4. Container Image Scan — Trivy
  #    Scans the built image for CVEs (HIGH/CRITICAL).
  #    Findings uploaded to GitHub Security tab (SARIF).
  # ─────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Image Scan (Trivy)
    needs: build
    uses: DEMO_ORG/security-gh-actions/.github/workflows/reusable-container-scan.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      image_tarball_artifact: docker-image
      image_name: devsecops-app
      severity: "HIGH,CRITICAL"
      fail_on_findings: true

  # ─────────────────────────────────────────────────────────────────────
  # 5. Security Gate
  #    Explicit summary job — branch protection requires THIS job to pass.
  #    Fails if any security scan found issues.
  # ─────────────────────────────────────────────────────────────────────
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest
    needs: [secrets-scan, sast, container-scan]
    if: always()
    steps:
      - name: Evaluate security gate
        run: |
          echo "=== Security Gate Results ==="
          echo "Secrets scan : ${{ needs.secrets-scan.result }}"
          echo "SAST         : ${{ needs.sast.result }}"
          echo "Container scan: ${{ needs.container-scan.result }}"

          if [[ "${{ needs.secrets-scan.result }}" != "success" ]] || \
             [[ "${{ needs.sast.result }}" != "success" ]] || \
             [[ "${{ needs.container-scan.result }}" != "success" ]]; then
            echo ""
            echo "SECURITY GATE FAILED — fix all findings before merging."
            exit 1
          fi

          echo ""
          echo "All security checks passed. PR is clear to merge."
