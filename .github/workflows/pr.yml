name: PR

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Secrets Scanning — TruffleHog (reusable from gh-actions-security)
  # ─────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    uses: Moz-Cyber-1/gh-actions-security/.github/workflows/secrets-scan-pr.yaml@main
    permissions:
      contents: read
      pull-requests: write

  # ─────────────────────────────────────────────────────────────────────
  # 2. SAST — Semgrep (reusable from gh-actions-security)
  # ─────────────────────────────────────────────────────────────────────
  sast:
    name: SAST
    uses: Moz-Cyber-1/gh-actions-security/.github/workflows/reusable-sast.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      config: "p/owasp-top-ten p/nodejs p/secrets"
      fail_on_findings: true

  # ─────────────────────────────────────────────────────────────────────
  # 3. Build Docker image — artifact passed to container scan
  # ─────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: devsecops-demo
    permissions:
      contents: read
    outputs:
      image_tarball: ${{ steps.meta.outputs.image_tarball }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          IMAGE="devsecops-app"
          TAG="pr-${{ github.event.pull_request.number }}-${{ github.sha }}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tarball=${IMAGE}.tar" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          podman build \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            .

      - name: Export image tarball
        run: |
          podman save \
            --format=docker \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            -o "${{ steps.meta.outputs.image_tarball }}"

      - name: Upload image tarball
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ steps.meta.outputs.image_tarball }}
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────
  # 4. Container Scan — Trivy (reusable from gh-actions-security)
  # ─────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan
    needs: build
    uses: Moz-Cyber-1/gh-actions-security/.github/workflows/reusable-container-scan.yml@main
    permissions:
      contents: read
      security-events: write
    with:
      image_tarball_artifact: docker-image
      image_name: devsecops-app
      severity: "HIGH,CRITICAL"
      fail_on_findings: true
