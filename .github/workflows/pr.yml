name: PR Pipeline — Security Scans

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Secrets Scanning — TruffleHog
  #    Scans every commit in the PR diff for leaked secrets.
  #    Fails the PR if any unverified or verified secret is detected.
  # ─────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: devsecops-demo
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog — scan PR commits
        id: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified=false --fail

      - name: Comment on PR if secrets found
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## Secrets Scan — FAILED',
                '',
                'TruffleHog detected **hardcoded secrets** in this PR.',
                '',
                '**Do NOT merge.** Remove the secrets, rotate any exposed credentials, and rewrite git history if needed.',
                '',
                '```',
                'git filter-repo --path <file> --invert-paths',
                '```',
              ].join('\n'),
            });

  # ─────────────────────────────────────────────────────────────────────
  # 2. SAST — Semgrep
  #    Scans for OWASP Top 10, injection flaws, hardcoded secrets.
  #    Findings uploaded to GitHub Security tab (SARIF).
  # ─────────────────────────────────────────────────────────────────────
  sast:
    name: SAST
    runs-on: devsecops-demo
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        id: semgrep
        run: |
          pip install semgrep --quiet
          semgrep scan \
            --config "p/owasp-top-ten" \
            --config "p/nodejs" \
            --config "p/secrets" \
            --sarif \
            --output semgrep.sarif \
            --error \
            src/ || echo "SEMGREP_FAILED=true" >> "$GITHUB_ENV"

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-sast
        continue-on-error: true

      - name: Fail if Semgrep found issues
        if: env.SEMGREP_FAILED == 'true'
        run: |
          echo "Semgrep found security issues. See GitHub Security tab for details."
          exit 1

  # ─────────────────────────────────────────────────────────────────────
  # 3. Container Image Scan — Trivy
  #    Builds the image and scans for HIGH/CRITICAL CVEs in one job.
  #    No artifact passing needed — build and scan in the same runner.
  # ─────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Scan
    runs-on: devsecops-demo
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag "devsecops-app:pr-${{ github.event.pull_request.number }}" \
            .

      - name: Run Trivy vulnerability scan
        id: trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "devsecops-app:pr-${{ github.event.pull_request.number }}"
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
        continue-on-error: true

      - name: Clean up image
        if: always()
        run: docker rmi "devsecops-app:pr-${{ github.event.pull_request.number }}" || true
