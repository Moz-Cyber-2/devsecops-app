name: Deploy — Build, Push & Apply to Kind

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Build and push image to GHCR
  #    Runs on GitHub-hosted runner (no local infra needed for build).
  # ─────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      image_full: ${{ steps.meta.outputs.image_full }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          TAG="${{ github.sha }}"
          IMAGE_FULL="ghcr.io/moz-cyber-2/devsecops-app:${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_full=${IMAGE_FULL}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/moz-cyber-2/devsecops-app:${{ github.sha }}
            ghcr.io/moz-cyber-2/devsecops-app:latest

  # ─────────────────────────────────────────────────────────────────────
  # 2. Deploy to local kind cluster via self-hosted runner
  #    Runner runs on the demo laptop with:
  #      - kind cluster 'devsecops-demo' running
  #      - kubectl configured for the kind cluster
  #      - Kyverno installed in enforce mode
  #      - Kyverno policies applied from kyverno-policies/
  #
  #    EXPECTED OUTCOME (demo): Kyverno BLOCKS the pod admission because:
  #      a) The container runs as root (no securityContext.runAsNonRoot)
  #      b) Image tag ':latest' is denied by deny-latest-tag policy
  #
  #    The kubectl apply will complete but the pod will never start —
  #    the ReplicaSet controller will show the admission webhook error.
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kind (Live Admission Check)
    needs: build-and-push
    runs-on: [self-hosted, devsecops-demo]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Show cluster state before deploy
        run: |
          echo "=== Kyverno policies in effect ==="
          kubectl get clusterpolicy -o wide || true
          echo ""
          echo "=== Current pods in devsecops-demo namespace ==="
          kubectl get pods -n devsecops-demo 2>/dev/null || echo "(namespace empty)"

      - name: Apply manifests via kustomize
        run: |
          echo "=== Applying manifests ==="
          kubectl apply -k manifests/local/
          echo ""
          echo "=== Waiting for rollout (expect Kyverno to block) ==="
          # Wait briefly — Kyverno webhook fires when the ReplicaSet
          # attempts to create the Pod. The Deployment applies fine,
          # but the Pod creation is what gets blocked.
          sleep 5

      - name: Show admission result
        if: always()
        run: |
          echo "=== Pod events (Kyverno admission decisions) ==="
          kubectl describe replicaset -n devsecops-demo 2>/dev/null | \
            grep -A 5 "Warning\|Error\|kyverno\|block\|deny" || \
            echo "(no events yet — check manually)"
          echo ""
          echo "=== Pod status ==="
          kubectl get pods -n devsecops-demo -o wide 2>/dev/null || true
          echo ""
          echo "=== Recent Kyverno policy violations ==="
          kubectl get policyreport -A 2>/dev/null || true

      - name: Kyverno block summary
        if: always()
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           KYVERNO LIVE ADMISSION CHECK — RESULT             ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Policies enforced:                                         ║"
          echo "║    ✗ require-run-as-non-root  (app runs as root)            ║"
          echo "║    ✗ deny-latest-tag           (:latest tag used)           ║"
          echo "║    ✓ require-resource-limits   (limits defined in manifest) ║"
          echo "╠══════════════════════════════════════════════════════════════╣"
          echo "║  Fix: add securityContext + pin image SHA to unblock        ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
